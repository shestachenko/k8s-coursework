apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-database
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-operator
  interval: 10m
  path: ./overlays/staging/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: n8n-db
      namespace: staging
