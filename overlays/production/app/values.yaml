image:
  repository: docker.n8n.io/n8nio/n8n
  tag: "2.9.0" # {"$imagepolicy": "flux-system:n8n:tag"}

queueMode:
  enabled: false

database:
  type: postgresdb
  useExternal: true
  host: n8n-db-rw.production.svc
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-credentials
    key: password

redis:
  enabled: false

replicaCount: 2

hpa:
  main:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

persistence:
  enabled: true
  size: 2Gi

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  sticky:
    enabled: true
  tls:
    - secretName: n8n-tls
      hosts:
        - n8n.production.local
  hosts:
    - host: n8n.production.local
      paths:
        - path: /
          pathType: Prefix

webhook:
  enabled: true
  url: https://n8n.production.local

config:
  timezone: Europe/Kyiv
  extraEnv:
    - name: N8N_EDITOR_BASE_URL
      value: https://n8n.production.local

secretRefs:
  existingSecret: n8n-secrets

resources:
  main:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
