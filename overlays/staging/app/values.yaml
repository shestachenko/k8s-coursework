image:
  repository: docker.n8n.io/n8nio/n8n
  tag: "2.9.0" # {"$imagepolicy": "flux-system:n8n:tag"}

queueMode:
  enabled: false

database:
  type: postgresdb
  useExternal: true
  host: n8n-db-rw.staging.svc
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-credentials
    key: password

redis:
  enabled: false

replicaCount: 1

persistence:
  enabled: true
  size: 1Gi

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: n8n.staging.local
      paths:
        - path: /
          pathType: Prefix

webhook:
  enabled: true
  url: http://n8n.staging.local

config:
  timezone: Europe/Moscow
  extraEnv:
    - name: WEBHOOK_URL
      value: http://n8n.staging.local/
    - name: N8N_EDITOR_BASE_URL
      value: http://n8n.staging.local

secretRefs:
  existingSecret: n8n-secrets

resources:
  main:
    requests:
      cpu: 50m
      memory: 128Mi
